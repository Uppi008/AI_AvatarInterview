# Render Blueprint for the backend half of AI_AvatarInterview -- 100% free
# tier: no Celery worker (Render has no free plan for background workers at
# all), so resume parsing / AI scoring / report generation run synchronously
# inside the web request instead, via CELERY_TASK_ALWAYS_EAGER below. Those
# endpoints respond slower than they would with a real queue, but nothing
# needs a paid instance or a card on file.
#
# The frontend deploys separately to Vercel (see docs/DEPLOY_VERCEL_RENDER.md).
#
# Usage: Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
# Vars marked `sync: false` are prompted for during that flow; fill them in
# per docs/DEPLOY_VERCEL_RENDER.md.

envVarGroups:
  - name: ai-avatarinterview-shared
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

# No Render-managed database: Render's free Postgres expires after 30 days
# (and is deleted 14 days later), which took the whole app down once. The
# database lives on Neon's free tier instead (no expiry); paste its
# connection string into DATABASE_URL below. See docs/DEPLOY_VERCEL_RENDER.md.

services:
  - type: keyvalue
    name: ai-avatarinterview-redis
    plan: free
    region: oregon
    ipAllowList: [] # private network only -- not reachable from the public internet

  - type: web
    name: ai-avatarinterview-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: >-
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             (python manage.py createsuperuser --noinput || true) &&
             python manage.py ensure_avatar_images &&
             daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    healthCheckPath: /healthz/
    envVars:
      - fromGroup: ai-avatarinterview-shared
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.render
      # No separate Celery worker on the free plan -- .delay() runs the task
      # inline, synchronously, in the same request instead of queuing it.
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      # Free plan has no Shell/SSH access, so `createsuperuser` can't be run
      # interactively -- these three make the startup command above create
      # it non-interactively instead. `|| true` makes that step a no-op
      # (not a crash) on every later restart, once the user already exists.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_FULL_NAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      # Neon connection string, e.g.
      # postgresql://user:pass@ep-xxxx.us-west-2.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-avatarinterview-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: ai-avatarinterview-redis
          property: connectionString
      # Your Vercel frontend URL, e.g. https://ai-avatarinterview.vercel.app
      # (comma-separated if you add a custom domain later).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
